# FENNIA MCT inventory — edit to taste.
# `name` doubles as the ssh alias unless `ssh:` is set; `tailscale:` defaults to name.
# Put the real host details in ~/.ssh/config so keys/users/ports live in one place.

callsign: Commander
squadron: FX-2 SQUADRON
probe_interval: 30        # seconds between ssh telemetry probes
tailscale_interval: 5     # seconds between `tailscale status` polls
probe_timeout: 15         # seconds before an ssh probe gives up (units can set their own `timeout:`)

# Optional: default key for every unit. A bare name is looked up in
# ~/.config/mct/keys (put keys there with `mct keys add <name>`); a path works too.
# Units can override with their own `identity:`. Leave unset to let ssh/agent decide.
# identity: mct_ed25519

# Optional: Proxmox API for the guest panel. Make a read-only token:
#   Datacenter → Permissions → API Tokens → add  root@pam!mct  (privilege separation ON)
#   then grant PVEAuditor on / to the token. Export it as PVE_TOKEN.
# proxmox:
#   host: https://pve01:8006
#   user: root@pam
#   token_name: mct
#   verify_tls: false

units:
  - name: pve01
    kind: pve
    tags: [core]
    lan: pve01-lan
    services: [pveproxy, pvedaemon, pve-cluster, zfs-zed]
    note: Proxmox host — the den

  - name: pihole
    kind: lxc
    tags: [net]
    services: [pihole-FTL, unbound]

  - name: media
    kind: vm
    tags: [lab]
    services: [jellyfin, docker]
    sites:
      - name: jellyfin
        url: https://jellyfin.example.com/health
        expect: 200             # exact status (default: any 2xx/3xx)
        contains: Healthy       # body must contain this text
      - name: blog
        url: https://blog.example.com

  - name: nas
    kind: host
    tags: [storage]
    lan: nas-lan
    services: [smbd, nfs-server]

  - name: ct-101
    kind: lxc
    tags: [lab]
    services: [docker]
    via: pve01                # no sshd of its own yet: reach it with `pct exec` on pve01
    via_exec: pct exec 101 --

  - name: truenas
    kind: appliance
    tags: [storage]
    lan: admin@192.168.1.20

  - name: sandbox
    kind: lxc
    tags: [lab]
    via: truenas              # Incus instance — via_exec defaults to "incus exec sandbox --"

# Optional: HTTP checks, run from wherever mct is running. Nest `sites:` under
# the unit that serves them and they appear as tree children in the UNITS list
# (status · response time · days until the TLS cert expires); Enter opens the
# URL. A unit with a down site shows ◐. Top-level `sites:` (no unit) are listed
# at the end. Transitions and certs under 14 days go to the log.
http_interval: 60
sites:
  - name: status-page
    url: https://status.example.com
